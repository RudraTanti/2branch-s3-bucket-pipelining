<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple HTML & CSS Card</title>
    <style>
        /* Base styles to clear browser defaults */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* The Card Container */
        .card {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            padding: 30px;
            width: 350px;
            text-align: center;
        }

        /* Heading Style */
        .card h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #2c3e50;
        }

        /* Paragraph Style */
        .card p {
            font-size: 15px;
            color: #7f8c8d;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        /* Button Style */
        .card .btn {
            display: inline-block;
            background-color: #3498db;
            color: #ffffff;
            text-decoration: none;
            padding: 10px 24px;
            border-radius: 25px;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }

        /* Hover Effect for Button */
        .card .btn:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>

    <!-- The actual content of the webpage -->
    <div class="card">
        <h1>Hello, World!</h1>
        <p>This is a very simple website component built using clean HTML structure and modern CSS styles. You can easily customize it!</p>
        <a href="#" class="btn">Get Started</a>
    </div>

</body>
</html>
